[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "patchcage"
version = "0.1.0"
description = "Least-privilege harness for test-verified vulnerability remediation"
requires-python = ">=3.12"
dependencies = [
  "docker",
  "httpx",
  "mcp>=2.1,<3",
  "pathspec",
  "pydantic",
  "PyYAML",
]

[project.optional-dependencies]
demo = [
  "flask",
]
dev = [
  "hypothesis",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchcage = ["py.typed"]
patchcage_workspace = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker: requires a running Docker daemon and the pinned runtime image",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Intentionally-vulnerable demo source and patch fixtures must keep exact bytes
# so reference patches apply deterministically; the project formatter must not
# rewrite them.
extend-exclude = ["demo_projects", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]
packages = ["patchcage", "patchcage_workspace"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
