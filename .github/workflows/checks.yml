name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements.lock -e '.[dev,demo]'
      - run: python -m ruff check src tests scripts
      - run: python -m mypy
      - run: docker info
      - run: python -m pytest
      - run: bash scripts/test_install.sh
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run hydrate:model-data
      - run: npm run build:offline
      - run: npm run check
      - run: node ../../node_modules/vitest/vitest.mjs run test/patchcage-agent-mode.test.ts test/patchcage-sandbox.test.ts test/args.test.ts
        working-directory: cli/packages/coding-agent
