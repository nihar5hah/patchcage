rules:
  - id: patchcage.python.sql-injection.formatted-query
    message: User-controlled data is interpolated into a SQL execution call.
    severity: ERROR
    languages:
      - python
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              def search_products($CONNECTION, $QUERY):
                ...
          - focus-metavariable: $QUERY
    pattern-sinks:
      - patterns:
          - pattern: $CONNECTION.execute($SQL, ...)
          - focus-metavariable: $SQL
    metadata:
      cwe:
        - CWE-89
      category: security
